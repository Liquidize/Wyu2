name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore src/FriendRadar.Protocol/FriendRadar.Protocol.csproj
          dotnet restore src/FriendRadar.Core/FriendRadar.Core.csproj
          dotnet restore src/FriendRadar.Relay/FriendRadar.Relay.csproj
          dotnet restore tests/FriendRadar.Tests/FriendRadar.Tests.csproj

      - name: Build relay
        run: dotnet build src/FriendRadar.Relay/FriendRadar.Relay.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/FriendRadar.Tests/FriendRadar.Tests.csproj -c Release --no-restore

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The plugin compiles against Dalamud's reference assemblies, which ship with the launcher.
      - name: Fetch Dalamud
        run: |
          mkdir -p "$HOME/dalamud"
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$HOME/dalamud"

      - name: Build
        run: dotnet build src/FriendRadar/FriendRadar.csproj -c Release -p:DalamudLibPath="$HOME/dalamud/"

      - uses: actions/upload-artifact@v4
        with:
          name: FriendRadar
          path: src/FriendRadar/bin/Release/FriendRadar/
          if-no-files-found: error
